services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma-test
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data

  # Sample target #1: a simple web server to monitor over HTTP
  demo-web:
    image: nginx:alpine
    container_name: demo-web
    restart: unless-stopped
    ports:
      - "8080:80"

  # Sample target #2: an HTTP echo/test service (status codes, delays, etc.)
  demo-api:
    image: mccutchen/go-httpbin
    container_name: demo-api
    restart: unless-stopped
    ports:
      - "8081:8080"

volumes:
  uptime-kuma-data:
