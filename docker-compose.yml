services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma-test
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data

  # Sample target #1: a simple web server to monitor over HTTP
  demo-web:
    image: nginx:alpine
    container_name: demo-web
    restart: unless-stopped
    ports:
      - "8080:80"

  # Sample target #2: an HTTP echo/test service (status codes, delays, etc.)
  demo-api:
    image: mccutchen/go-httpbin
    container_name: demo-api
    restart: unless-stopped
    ports:
      - "8081:8080"

  # Simulates a periodic job (e.g. a backup script) that must "check in" via
  # the Push monitor's URL. Stop this container to simulate the job silently
  # failing, instead of a normal connection error.
  heartbeat-pusher:
    image: curlimages/curl:8.10.1
    container_name: heartbeat-pusher
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while true; do curl -fsS \"$$PUSH_URL\"; sleep 15; done"]
    environment:
      - PUSH_URL=http://uptime-kuma:3001/api/push/i9LNLCFZhm?status=up&msg=OK&ping=

volumes:
  uptime-kuma-data:
